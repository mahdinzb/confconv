<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convert Persian, English, and mixed-language content into Confluence Wiki Markup or Markdown.">
  <title>ConfConv — Confluence Content Converter</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand"><span class="mark">CC</span><div><strong>ConfConv</strong><small>Content formatted for Confluence</small></div></div>
    </header>
    <section class="toolbar">
      <div class="metrics">
        <span><b id="blocks">0</b> blocks</span><span><b id="codes">0</b> code blocks</span><span><b id="tables">0</b> tables</span>
      </div>
      <div class="segmented" aria-label="Output format">
        <button id="wiki-tab" class="active">Confluence Wiki ✓</button>
        <button id="markdown-tab">Markdown</button>
      </div>
    </section>
    <section class="workspace">
      <article class="panel input-panel">
        <div class="panel-head"><div><span>01</span><h2>Source text</h2></div><button id="clear" class="ghost">Clear</button></div>
        <textarea id="source" spellcheck="true" dir="auto" aria-label="Source text" placeholder="Paste Persian, English, or mixed-language text here…"></textarea>
        <div class="panel-foot"><span>Markdown or plain text</span><span id="characters">0 characters</span></div>
      </article>
      <article class="panel output-panel">
        <div class="panel-head"><div><span>02</span><h2>Confluence output</h2></div><button id="copy" class="copy">Copy Confluence Wiki</button></div>
        <textarea id="output" class="output" readonly dir="auto" aria-label="Converted output"></textarea>
        <div class="panel-foot"><span id="usage">Use in Confluence: Insert → Markup → Confluence Wiki</span><span id="format" class="ready">Confluence Wiki</span></div>
      </article>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
